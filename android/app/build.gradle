plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mada.app'
    compileSdk 35
    defaultConfig { applicationId 'com.mada.app'; minSdk 23; targetSdk 35; versionCode 15; versionName '1.15' } // button-audit build
    signingConfigs { release { def p=System.getenv(); if(p.MADA_KEYSTORE_PATH&&p.MADA_KEYSTORE_PASSWORD&&p.MADA_KEY_ALIAS&&p.MADA_KEY_PASSWORD){storeFile file(p.MADA_KEYSTORE_PATH);storePassword p.MADA_KEYSTORE_PASSWORD;keyAlias p.MADA_KEY_ALIAS;keyPassword p.MADA_KEY_PASSWORD} } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
}

def madaWebDir = file("$projectDir/src/main/assets/mada_web")
def madaWebSource = file("$rootDir/..")
def madaWebSync = tasks.register('syncMadaWeb') {
    doLast {
        delete madaWebDir
        copy {
            from madaWebSource
            into madaWebDir
            exclude '.git/**', '.github/**', 'android/**', '**/.DS_Store'
            exclude 'node_modules/**', 'dist/**', 'build/**'
        }
        File index = new File(madaWebDir,'index.html')
        if(!index.exists()) throw new GradleException('Mada index.html was not bundled from the checked-out source')
        println("Mada web assets bundled from checked-out source: $madaWebSource")
    }
}

tasks.named('preBuild').configure { dependsOn(madaWebSync) }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.15.0'
}