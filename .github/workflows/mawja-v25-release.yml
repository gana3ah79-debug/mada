name: Mawja V25 Release APK

on:
  push:
    branches: [mawja-v25-build]
    paths:
      - '.mawja-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mawja source
        uses: actions/checkout@v4

      - name: Reconstruct Mawja V25 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -d .mawja-parts
          ls .mawja-parts/part*.hex >/dev/null
          cat .mawja-parts/part*.hex | tr -d '\n\r\t ' | xxd -r -p > Mawja-Native-V25-Deep-Review-Source.zip
          unzip -tq Mawja-Native-V25-Deep-Review-Source.zip
          unzip -q -o Mawja-Native-V25-Deep-Review-Source.zip -d ./mawja-source
          cp -a ./mawja-source/. ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
