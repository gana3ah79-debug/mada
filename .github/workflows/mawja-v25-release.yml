name: Mawja V25 Release APK

on:
  push:
    branches: [mawja-v25-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mawja source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Unpack Mawja V25 source
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name 'Mawja-Native-V25-Deep-Review-Source.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d ./mawja-source
            cp -a ./mawja-source/. ./
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error