name: Mawja V25 Release APK

on:
  push:
    branches: [mawja-v25-build]
    paths:
      - '.mawja-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mawja source
        uses: actions/checkout@v4

      - name: Reconstruct Mawja V25 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -d .mawja-parts
          mapfile -t PARTS < <(find .mawja-parts -maxdepth 1 -type f -name 'part*.b64' -printf '%f\n' | LC_ALL=C sort -V)
          test "${#PARTS[@]}" -gt 0
          printf '%s\n' "${PARTS[@]}"
          : > Mawja-Native-V25-Deep-Review-Source.b64
          for f in "${PARTS[@]}"; do cat ".mawja-parts/$f" >> Mawja-Native-V25-Deep-Review-Source.b64; done
          tr -d '\n\r\t ' < Mawja-Native-V25-Deep-Review-Source.b64 | base64 -d > Mawja-Native-V25-Deep-Review-Source.zip
          echo "BASE64_BYTES=$(wc -c < Mawja-Native-V25-Deep-Review-Source.b64)"
          echo "ZIP_BYTES=$(wc -c < Mawja-Native-V25-Deep-Review-Source.zip)"
          sha256sum Mawja-Native-V25-Deep-Review-Source.b64
          sha256sum Mawja-Native-V25-Deep-Review-Source.zip
          test "$(sha256sum Mawja-Native-V25-Deep-Review-Source.zip | awk '{print $1}')" = "41d0352980313a932652af1d1d13243ca52fd26a29ad9c8ad15a7e4e810f5bc6"
          unzip -tq Mawja-Native-V25-Deep-Review-Source.zip
          unzip -q -o Mawja-Native-V25-Deep-Review-Source.zip -d ./mawja-source
          cp -a ./mawja-source/. ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
