name: Mada Final Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed Mada release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Mada launcher icon
        run: |
          sed -i 's/android:label="Mada"/android:label="Mada" android:icon="@drawable\/mada_launcher" android:roundIcon="@drawable\/mada_launcher"/' android/app/src/main/AndroidManifest.xml

      - name: Prepare release keystore
        env:
          MADA_KEYSTORE_BASE64: ${{ secrets.MADA_KEYSTORE_BASE64 }}
        run: |
          test -n "$MADA_KEYSTORE_BASE64"
          echo "$MADA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mada-release.jks"
          test -s "$RUNNER_TEMP/mada-release.jks"

      - name: Build signed release APK
        env:
          MADA_KEYSTORE_PATH: ${{ runner.temp }}/mada-release.jks
          MADA_KEYSTORE_PASSWORD: ${{ secrets.MADA_KEYSTORE_PASSWORD }}
          MADA_KEY_ALIAS: ${{ secrets.MADA_KEY_ALIAS }}
          MADA_KEY_PASSWORD: ${{ secrets.MADA_KEY_PASSWORD }}
        run: gradle -p android clean assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Publish final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mada-Final-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
