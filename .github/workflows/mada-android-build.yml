name: Build Mada Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/mada-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Android notification channel constant
        run: sed -i 's/new NotificationChannel("mada_bg","Mada Buzz","LOW")/new NotificationChannel("mada_bg","Mada Buzz",NotificationManager.IMPORTANCE_LOW)/' android/app/src/main/java/com/mada/app/BuzzService.java

      - name: Prepare Mada production signing
        env:
          MADA_KEYSTORE_BASE64: ${{ secrets.MADA_KEYSTORE_BASE64 }}
        run: |
          test -n "$MADA_KEYSTORE_BASE64" || { echo "Missing MADA_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$MADA_KEYSTORE_BASE64" | base64 --decode > /tmp/mada-release.jks
          test -s /tmp/mada-release.jks

      - name: Build signed release APK
        env:
          MADA_KEYSTORE_PATH: /tmp/mada-release.jks
          MADA_KEYSTORE_PASSWORD: ${{ secrets.MADA_KEYSTORE_PASSWORD }}
          MADA_KEY_ALIAS: ${{ secrets.MADA_KEY_ALIAS }}
          MADA_KEY_PASSWORD: ${{ secrets.MADA_KEY_PASSWORD }}
        run: |
          test -n "$MADA_KEYSTORE_PASSWORD" || { echo "Missing MADA_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$MADA_KEY_ALIAS" || { echo "Missing MADA_KEY_ALIAS secret"; exit 1; }
          test -n "$MADA_KEY_PASSWORD" || { echo "Missing MADA_KEY_PASSWORD secret"; exit 1; }
          gradle -p android :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mada-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Fresh APK build trigger after the latest Mada profile update.
