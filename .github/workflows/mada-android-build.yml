name: Build Wanas V7 APK

on:
  push:
    branches:
      - wanas-v7-apk-build
    paths:
      - 'android/**'
      - 'wanas-v7-ci/**'
      - '.github/workflows/mada-android-build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Wanas V7 project
        run: |
          set -euo pipefail
          test -f wanas-v7-src/settings.gradle
          test -f wanas-v7-src/build.gradle
          test -f wanas-v7-src/app/build.gradle
          test -f wanas-v7-src/app/src/main/java/com/wanas/nativeapp/MainActivity.kt
          test -f wanas-v7-src/app/src/main/java/com/wanas/nativeapp/VoiceEngine.kt
          test -f wanas-v7-src/app/src/main/java/com/wanas/nativeapp/realtime/SupabaseRealtime.kt
          rm -rf android
          cp -a wanas-v7-src android
          test -f android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt

      - name: Configure AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' > android/gradle.properties

      - name: Verify V7 Kotlin/WebRTC source
        run: |
          set -euo pipefail
          grep -n 'import okhttp3.MediaType.Companion.toMediaType' android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt
          grep -n 'import okhttp3.RequestBody.Companion.toRequestBody' android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt
          grep -n 'open class SdpObserverBase' android/app/src/main/java/com/wanas/nativeapp/VoiceEngine.kt
          ! grep -n 'onIceCandidateError' android/app/src/main/java/com/wanas/nativeapp/VoiceEngine.kt

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-v7-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
