name: Build Wanas V7 APK

on:
  push:
    branches:
      - wanas-v7-apk-build
    paths:
      - 'android/**'
      - 'wanas-v7-ci/**'
      - '.github/workflows/mada-android-build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Wanas V7 project
        run: |
          set -euo pipefail
          cat \
            wanas-v7-ci/source.part0.fix.a.b64 \
            wanas-v7-ci/source.part0.fix.b.b64 \
            wanas-v7-ci/source.part0.fixc.a.b64 \
            wanas-v7-ci/source.part0.fixc.b.b64 \
            wanas-v7-ci/source.part0.fixc.c.b64 \
            wanas-v7-ci/source.part0.fixc.e.b64 \
            wanas-v7-ci/source.part0.fixd.a.b64 \
            wanas-v7-ci/source.part0.fixd.b.b64 \
            wanas-v7-ci/source.part0.fixd.c2.b64 \
            wanas-v7-ci/source.part0.fixd.d.b64 \
            wanas-v7-ci/source.part0.fix1.a.b64 \
            wanas-v7-ci/source.part0.fix1.b.b64 \
            wanas-v7-ci/source.part0.fix1.c.b64 \
            wanas-v7-ci/source.part0.fix1.d.b64 \
            wanas-v7-ci/source.part0.02.b64 \
            wanas-v7-ci/source.part0.03.b64 \
            wanas-v7-ci/source.part1.b64 \
            wanas-v7-ci/source.part2.b64 \
            wanas-v7-ci/source.part3.b64 > /tmp/wanas-v7.b64

          echo "Base64 characters: $(wc -c < /tmp/wanas-v7.b64)"
          test "$(wc -c < /tmp/wanas-v7.b64)" -eq 22356

          base64 -d /tmp/wanas-v7.b64 > /tmp/Wanas-Native-V7.zip
          unzip -t /tmp/Wanas-Native-V7.zip | tail -n 3

          rm -rf android
          mkdir -p android
          unzip -q /tmp/Wanas-Native-V7.zip -d android

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt

      - name: Configure AndroidX
        run: |
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=true' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' > android/gradle.properties

      - name: Patch V7 Kotlin/WebRTC compile issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          main = Path("android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt")
          s = main.read_text(encoding="utf-8")
          if "import okhttp3.MediaType.Companion.toMediaType" not in s:
              marker = "import okhttp3.Request"
              s = s.replace(marker, marker + "\nimport okhttp3.MediaType.Companion.toMediaType\nimport okhttp3.RequestBody.Companion.toRequestBody", 1)
          main.write_text(s, encoding="utf-8")
          
          voice = Path("android/app/src/main/java/com/wanas/nativeapp/VoiceEngine.kt")
          s = voice.read_text(encoding="utf-8")
          s = s.replace("abstract class SdpObserverBase : org.webrtc.SdpObserver", "open class SdpObserverBase : org.webrtc.SdpObserver")
          s = s.replace("            override fun onIceCandidateError(e: PeerConnection.IceCandidateErrorEvent?) {}\n", "")
          voice.write_text(s, encoding="utf-8")
          PY
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-v7-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
