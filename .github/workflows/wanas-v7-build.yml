name: Build Wanas V7 APK

on:
  push:
    branches:
      - wanas-v7-apk-build
    paths:
      - 'wanas-v7-ci/**'
      - '.github/workflows/wanas-v7-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Wanas source
        working-directory: wanas-v7-ci
        run: |
          cat             source.part0.fix.a.b64             source.part0.fix.b.b64             source.part0.fixc.a.b64             source.part0.fixc.b.b64             source.part0.fixc.c.b64             source.part0.fixc.e.b64             source.part0.fix1.a.b64             source.part0.fix1.b.b64             source.part0.fix1.c.b64             source.part0.fix1.d.b64             source.part1.b64             source.part2.b64             source.part3.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q -o source.zip -d build_src
          test -f build_src/build.gradle
          test -f build_src/app/build.gradle
          test -f build_src/app/src/main/java/com/wanas/nativeapp/MainActivity.kt

      - name: Build release APK
        working-directory: wanas-v7-ci/build_src
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          test -f wanas-v7-ci/build_src/app/build/outputs/apk/release/app-release.apk
          ls -lh wanas-v7-ci/build_src/app/build/outputs/apk/release/app-release.apk
          file wanas-v7-ci/build_src/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-v7-release-apk
          path: wanas-v7-ci/build_src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
