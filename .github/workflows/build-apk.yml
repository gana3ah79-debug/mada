name: Build Mada Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Mada release APK
        run: gradle -p android clean assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Mada Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mada-Release-APK-v1.2
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
