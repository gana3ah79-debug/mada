name: Build Mada APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle Mada web app into APK assets
        run: |
          mkdir -p android/app/src/main/assets/mada
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.ico' \) -exec cp -f {} android/app/src/main/assets/mada/ \;
          if [ -d assets ]; then cp -R assets/. android/app/src/main/assets/mada/; fi
          test -f android/app/src/main/assets/mada/index.html
          echo "Bundled files: $(find android/app/src/main/assets/mada -type f | wc -l)"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mada.apk

      - name: Show APK size
        run: ls -lh Mada.apk

      - name: Upload Mada APK
        uses: actions/upload-artifact@v4
        with:
          name: Mada-APK-Full
          path: Mada.apk
