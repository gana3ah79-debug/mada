name: Build Mada Production Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode Mada release keystore
        env:
          MADA_KEYSTORE_BASE64: ${{ secrets.MADA_KEYSTORE_BASE64 }}
        run: |
          test -n "$MADA_KEYSTORE_BASE64"
          printf '%s' "$MADA_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/mada-release.jks"
          test -s "$GITHUB_WORKSPACE/mada-release.jks"

      - name: Build signed Mada APK and AAB
        env:
          MADA_KEYSTORE_PATH: ${{ github.workspace }}/mada-release.jks
          MADA_KEYSTORE_PASSWORD: ${{ secrets.MADA_KEYSTORE_PASSWORD }}
          MADA_KEY_ALIAS: ${{ secrets.MADA_KEY_ALIAS }}
          MADA_KEY_PASSWORD: ${{ secrets.MADA_KEY_PASSWORD }}
        run: |
          test -n "$MADA_KEYSTORE_PASSWORD"
          test -n "$MADA_KEY_ALIAS"
          test -n "$MADA_KEY_PASSWORD"
          gradle -p android clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Clean signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/mada-release.jks"

      - name: Upload Mada production APK
        uses: actions/upload-artifact@v4
        with:
          name: Mada-Release-v1.3-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Mada production AAB
        uses: actions/upload-artifact@v4
        with:
          name: Mada-Release-v1.3-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
