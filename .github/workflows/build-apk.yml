name: Build Mada Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        run: gradle -p android clean assembleRelease --no-daemon --stacktrace

      - name: Decode Mada release keystore
        env:
          MADA_KEYSTORE_BASE64: ${{ secrets.MADA_KEYSTORE_BASE64 }}
        run: |
          test -n "$MADA_KEYSTORE_BASE64"
          printf '%s' "$MADA_KEYSTORE_BASE64" | base64 --decode > mada-release.jks
          test -s mada-release.jks

      - name: Sign Mada release APK
        env:
          MADA_KEYSTORE_PASSWORD: ${{ secrets.MADA_KEYSTORE_PASSWORD }}
          MADA_KEY_ALIAS: ${{ secrets.MADA_KEY_ALIAS }}
          MADA_KEY_PASSWORD: ${{ secrets.MADA_KEY_PASSWORD }}
        run: |
          test -n "$MADA_KEYSTORE_PASSWORD"
          test -n "$MADA_KEY_ALIAS"
          test -n "$MADA_KEY_PASSWORD"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks mada-release.jks \
            --ks-key-alias "$MADA_KEY_ALIAS" \
            --ks-pass "pass:$MADA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$MADA_KEY_PASSWORD" \
            --out Mada-Release-v1.2.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose Mada-Release-v1.2.apk
          ls -lh Mada-Release-v1.2.apk
          rm -f mada-release.jks

      - name: Upload signed Mada APK
        uses: actions/upload-artifact@v4
        with:
          name: Mada-Release-APK-v1.2
          path: Mada-Release-v1.2.apk
          if-no-files-found: error
          retention-days: 30
