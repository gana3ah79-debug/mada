name: Wanas V7 Fast APK

on:
  push:
    branches: [wanas-v7-apk-build]
    paths:
      - 'wanas-v7-ci/Wanas-Native-V7-Whole-App-FIXED.zip'
      - '.github/workflows/wanas-fast-build.yml'
      - 'wanas-v7-ci/BUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Gradle and Android SDK
        run: |
          set -e
          gradle --version
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb" || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Extract Wanas V7
        run: |
          set -euo pipefail
          rm -rf android
          mkdir -p android
          unzip -t wanas-v7-ci/Wanas-Native-V7-Whole-App-FIXED.zip >/dev/null
          unzip -q wanas-v7-ci/Wanas-Native-V7-Whole-App-FIXED.zip -d android
          test -f android/app/build.gradle
          test -f android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt

      - name: Configure AndroidX
        run: |
          printf '%s
'             'android.useAndroidX=true'             'android.enableJetifier=true'             'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'             > android/gradle.properties

      - name: Patch V7 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt")
          s = main.read_text(encoding="utf-8")
          if "import okhttp3.MediaType.Companion.toMediaType" not in s:
              marker = "import okhttp3.*"
              if marker not in s:
                  raise SystemExit("OkHttp wildcard import not found")
              s = s.replace(
                  marker,
                  marker + "\n"
                  "import okhttp3.MediaType.Companion.toMediaType\n"
                  "import okhttp3.RequestBody.Companion.toRequestBody",
                  1,
              )
          main.write_text(s, encoding="utf-8")

          voice = Path("android/app/src/main/java/com/wanas/nativeapp/VoiceEngine.kt")
          s = voice.read_text(encoding="utf-8")
          s = s.replace(
              "abstract class SdpObserverBase : org.webrtc.SdpObserver",
              "open class SdpObserverBase : org.webrtc.SdpObserver",
          )
          s = s.replace(
              "            override fun onIceCandidateError(e: PeerConnection.IceCandidateErrorEvent?) {}\n",
              "",
          )
          voice.write_text(s, encoding="utf-8")
          PY

          grep -n 'okhttp3.*toMediaType\|okhttp3.*toRequestBody'             android/app/src/main/java/com/wanas/nativeapp/MainActivity.kt

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Verify APK
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-v7-debug-apk-fast
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
