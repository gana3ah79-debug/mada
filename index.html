<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><title>Mada</title><link rel="stylesheet" href="styles.css?v=20260901-20"></head><body>
<section id="auth"><div class="auth-card card"><div class="brand">Mada</div><p class="muted">شبكة اجتماعية عربية</p><input id="nameInput" type="text" placeholder="الاسم (للحساب الجديد)"><input id="emailInput" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="passwordInput" type="password" placeholder="كلمة المرور - 6 أحرف على الأقل" autocomplete="current-password"><button id="loginBtn" class="primary" type="button">دخول</button><button id="adminLoginBtn" class="admin-action" type="button">⚙️ دخول الإدارة</button><div id="authMsg" class="muted"></div></div></section>
<main id="app" hidden><header class="topbar"><div class="brand">Mada</div><div class="top-actions"><button id="themeBtn" type="button">🌙</button><button id="notifyBtn" type="button">🔔</button><button id="msgBtn" type="button">💬</button><button id="premiumBtn" type="button">💎</button><button id="profileNav" class="avatar" type="button">م</button></div></header><section class="container"><div class="card premium-banner" id="premiumBanner"><b>💎 Mada Premium</b><span>مزايا إضافية وتجربة أفضل</span><button id="premiumBannerBtn" class="premium-btn">اشترك الآن</button></div><div class="card composer"><div class="post-head"><div id="userAvatar" class="avatar">م</div><b>ماذا تريد أن تنشر؟</b></div><textarea id="postInput" placeholder="اكتب منشورك..." rows="4"></textarea><input id="imageInput" type="file" accept="image/*" hidden><div class="composer-actions"><button id="photoBtn" type="button">📷 صورة</button><button id="createNav" type="button">✍️ كتابة</button><button id="postBtn" class="primary" type="button">نشر</button></div></div><nav class="nav-row"><button id="friendsNav" type="button">👥 الأصدقاء</button><button id="notifyNav" type="button">🔔 الإشعارات</button><button id="msgBtn2" type="button">💬 الرسائل</button></nav><section id="feed"><div class="card empty">جاري التحميل…</div></section></section></main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close" type="button">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260901-20"></script><script src="client-bridge.js?v=20260901-4"></script><script src="app.js?v=20260901-20"></script><script src="profile.js?v=20260901-2"></script><script src="social.js?v=20260901-2"></script><script src="mada-data-fix.js?v=20260901-3"></script><script src="login-v2.js?v=20260901-5"></script><script src="mada-features-v3.js?v=20260901-2"></script><script src="mada-runtime-fix.js?v=20260901-1"></script>
<script>(function(){const c=document.getElementById('closeModal');if(c&&window.madaRuntimeClose)c.onclick=window.madaRuntimeClose;window.setTimeout(function(){if(window.madaRuntimeBoot)window.madaRuntimeBoot().catch(function(e){console.error('Mada runtime',e)});},0);})();</script>
</body></html>
