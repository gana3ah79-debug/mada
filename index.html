<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>Mada</title>
<link rel="stylesheet" href="styles.css?v=20260901-10">
<style>
html,body{margin:0;min-height:100%;background:#f6f8fc}#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.auth-card{width:min(430px,100%);padding:28px;text-align:center}.auth-card input{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:14px;border:1px solid #e1e6ef;border-radius:14px;background:#fff;font-size:16px}.auth-card button{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:13px;font-size:16px;font-weight:700}.auth-card .primary{background:linear-gradient(135deg,#5b5ff7,#1677ff);color:#fff}.auth-card .brand{font-size:42px;font-weight:900;color:#4d57e8;margin-bottom:8px}.muted{color:#748096}#modal[hidden]{display:none!important}
</style>
</head>
<body>
<section id="auth"><div class="auth-card card"><div class="brand">Mada</div><p class="muted">شبكة اجتماعية عربية</p><input id="nameInput" type="text" placeholder="الاسم (للحساب الجديد)"><input id="emailInput" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="passwordInput" type="password" placeholder="كلمة المرور - 6 أحرف على الأقل" autocomplete="current-password"><button id="loginBtn" class="primary" type="button">دخول</button><button id="adminLoginBtn" class="admin-action" type="button">⚙️ دخول الإدارة</button><button id="authThemeBtn" type="button" onclick="document.body.classList.toggle('dark')">🌙 الوضع الداكن</button><div id="authMsg" class="muted"></div></div></section>
<main id="app" hidden><header class="topbar"><div class="brand">Mada</div><div class="top-actions"><button id="themeBtn" type="button">🌙</button><button id="notifyBtn" type="button">🔔</button><button id="msgBtn" type="button">💬</button><button id="premiumBtn" type="button">💎</button><button id="profileNav" class="avatar" type="button">م</button></div></header><section class="container"><div id="premiumBanner" class="card premium-banner"><b>💎 Mada Premium</b><span>مزايا إضافية وتجربة أفضل</span><button id="premiumBannerBtn" class="premium-btn">اشترك الآن</button></div><div class="card composer"><div class="post-head"><div id="userAvatar" class="avatar">م</div><b>ماذا تريد أن تنشر؟</b></div><textarea id="postInput" placeholder="اكتب منشورك..." rows="4"></textarea><input id="imageInput" type="file" accept="image/*" hidden><div class="composer-actions"><button id="photoBtn" type="button">📷 صورة</button><button id="createNav" type="button">✍️ كتابة</button><button id="postBtn" class="primary" type="button">نشر</button></div></div><nav class="nav-row"><button id="friendsNav" type="button">👥 الأصدقاء</button><button id="notifyNav" type="button">🔔 الإشعارات</button><button id="msgBtn2" type="button" onclick="document.getElementById('msgBtn').click()">💬 الرسائل</button></nav><section id="feed"><div class="card empty">جاري التحميل…</div></section></section></main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close" type="button">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260901-10"></script><script src="client-bridge.js?v=20260901-1"></script><script src="app.js?v=20260901-10"></script><script src="login-fix.js?v=20260901-10"></script><script src="login-v2.js?v=20260901-1"></script><script src="boot-fix.js?v=20260901-3"></script>
</body></html>
