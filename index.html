<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Mada — مدى</title><link rel="stylesheet" href="styles.css?v=20260901-29"><link rel="stylesheet" href="social-upgrades.css?v=20260902-1"><link rel="stylesheet" href="reactions.css?v=20260901-2"><link rel="stylesheet" href="auth-fix.css?v=20260901-5"><link rel="stylesheet" href="mada-feature-controls.css?v=20260902-5"><link rel="stylesheet" href="profile-fix.css?v=20260902-2"><link rel="stylesheet" href="profile-facebook-ui.css?v=20260902-1"><style>.stories-title{display:flex;align-items:center;gap:10px}.stories-title .story-tools{display:flex;gap:6px}.story-tools button{border:0;background:#eef4ff;color:#2871df;border-radius:12px;padding:7px 9px;font-weight:800}.story-card{min-width:78px}.story-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.story-video{width:100%;max-height:70vh;border-radius:18px;background:#000}.reels-list{display:grid;gap:14px}.reel-item{background:#000;border-radius:20px;overflow:hidden}.reel-item video{display:block;width:100%;max-height:70vh;object-fit:contain}.reel-caption{background:#fff;padding:10px}.media-picker{width:100%;padding:14px;border:1px dashed #aebbd0;border-radius:14px;background:#f7f9fc;margin:8px 0}.media-caption{width:100%;padding:12px;border:1px solid #dfe5ee;border-radius:14px;margin:8px 0}.mada-story-player{position:relative;background:#000;border-radius:18px;overflow:hidden;min-height:55vh;display:flex;align-items:center;justify-content:center}.mada-story-player img,.mada-story-player video{display:block;width:100%;height:70vh;max-height:70vh;object-fit:cover;background:#000}.mada-story-progress{position:absolute;z-index:3;top:10px;left:12px;right:12px;height:4px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden}.mada-story-progress i{display:block;height:100%;width:0;background:#fff;border-radius:99px;animation:madaStory2s 2s linear forwards}@keyframes madaStory2s{from{width:0}to{width:100%}}.mada-story-caption{position:absolute;z-index:2;bottom:0;left:0;right:0;padding:30px 14px 14px;color:#fff;font-weight:800;text-shadow:0 1px 4px #000;background:linear-gradient(transparent,rgba(0,0,0,.7))}</style></head>
<body>
<section id="auth" class="auth-screen"><div class="auth-card"><button class="auth-sheet-close" type="button" aria-label="إغلاق">×</button><div class="mada-logo large"><span class="logo-mark">M</span><div>MADA</div><small>مدى</small></div><p>تواصل .. شارك .. اكتشف</p><input id="nameInput" type="text" placeholder="الاسم الكامل (اختياري)" autocomplete="name"><input id="emailInput" type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" autocomplete="username"><input id="passwordInput" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn" class="primary wide" type="button">تسجيل الدخول</button><button id="signupBtn" class="auth-secondary wide" type="button">إنشاء حساب جديد</button><button id="forgotBtn" class="link-btn" type="button">نسيت كلمة السر؟</button><div id="authMsg" class="muted"></div></div></section>
<main id="app" hidden>
<header class="topbar"><button id="menuBtn" class="icon-btn" type="button">☰</button><div class="mada-wordmark">MADA</div><div class="top-actions"><button id="searchBtn" class="icon-btn" type="button">⌕</button><button id="msgBtn" class="icon-btn" type="button">💬</button><button id="themeBtn" class="legacy-control" type="button">🌙</button><button id="notifyBtn" class="legacy-control" type="button">🔔</button><button id="premiumBtn" class="legacy-control" type="button">💎</button></div></header>
<section class="page-wrap"><div class="stories card"><div class="stories-title"><b>القصص</b><div class="story-tools"><button id="allStoriesBtn" type="button">عرض الكل</button><button id="reelsBtn" type="button">🎬 الريلز</button></div></div><div id="storyRow" class="story-row"><button id="addStoryBtn" class="story-card add-story" type="button"><div class="story-avatar plus">+</div><b>إنشاء قصة</b></button></div></div>
<div class="card composer"><div class="composer-row"><button id="profileNav" class="avatar big-avatar" type="button">م</button><button id="createNav" class="think-input" type="button">بم تفكر؟</button></div><div class="composer-actions reference-actions"><button id="photoBtn" type="button">🖼️ صورة</button><button id="videoBtn" type="button">🎥 فيديو</button><button type="button">📍 موقع</button><button type="button">🙂 شعور</button></div><textarea id="postInput" placeholder="اكتب منشورك..." rows="3"></textarea><input id="imageInput" type="file" accept="image/*,video/*" hidden><div class="composer-actions publish-row"><button id="postBtn" class="primary" type="button">نشر</button></div></div>
<div class="card quick-grid"><button id="friendsNav" type="button"><span>👥</span>الأصدقاء</button><button id="msgBtn2" type="button"><span>💬</span>الرسائل</button><button id="notifyNav" type="button"><span>🔔</span>الإشعارات</button><button id="premiumBannerBtn" type="button"><span>💎</span>Premium</button></div>
<div id="premiumBanner" class="card premium-banner"><div><b>Mada Premium 💎</b><span>مزايا إضافية وتجربة أفضل</span></div><button id="premiumBannerAction" class="premium-btn" type="button">اشترك الآن</button></div><section id="feed" class="feed"><div class="card empty">جاري تحميل المنشورات…</div></section></section>
<nav class="bottom-nav"><button class="active" type="button">🏠<span>الرئيسية</span></button><button id="friendsBottom" type="button">👥<span>الأصدقاء</span></button><button id="createBottom" class="bottom-plus" type="button">＋</button><button id="notifyBottom" type="button">🔔<span>الإشعارات</span></button><button id="menuBottom" type="button">☰<span>القائمة</span></button></nav></main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close" type="button">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260901-26"></script><script src="app.js?v=20260901-24"></script><script src="app-hotfix.js?v=20260901-5"></script><script src="auth-stable.js?v=20260902-4"></script><script src="profile.js?v=20260902-3"></script><script src="social.js?v=20260901-5"></script><script src="payment-ui.js?v=20260901-3"></script><script src="admin-inline.js?v=20260901-2"></script><script src="reactions.js?v=20260902-4"></script><script src="reaction-enhancer.js?v=20260902-1"></script><script src="post-menu.js?v=20260902-3"></script><script src="post-layout-fix.js?v=20260901-2"></script><script src="mada-social-upgrades.js?v=20260902-1"></script>
<script>
(function(){
 const sb=()=>window.MADA_SUPABASE_CLIENT||window.sb; const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
 function modal(t,b){if(window.showModal)showModal(t,b)}
 async function upload(file,kind,caption){if(!file||!window.user)throw new Error('سجّل الدخول أولاً');const s=sb();const ext=(file.name.split('.').pop()||'bin').toLowerCase();const path=`${window.user.id}/${kind}-${crypto.randomUUID()}.${ext}`;const up=await s.storage.from('mada-media').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(up.error)throw up.error;const url=s.storage.from('mada-media').getPublicUrl(path).data.publicUrl;const r=await s.from('posts').insert({author_id:window.user.id,body:caption||'',media_url:url,visibility:kind});if(r.error)throw r.error;return url}
 function create(kind){const video=kind==='reel';modal(video?'🎬 إنشاء ريل':'➕ إنشاء قصة',`<p>${video?'اختر فيديو الريلز.':'اختر صورة أو فيديو للقصة (تختفي بعد 24 ساعة من العرض).'}</p><input id="srFile" class="media-picker" type="file" accept="${video?'video/*':'image/*,video/*'}"><input id="srCaption" class="media-caption" placeholder="اكتب وصفًا (اختياري)"><button id="srPublish" class="primary wide" type="button">${video?'نشر الريلز':'نشر القصة'}</button><p id="srMsg" class="muted"></p>`);$('srPublish').onclick=async()=>{const f=$('srFile').files[0];if(!f){$('srMsg').textContent='اختر ملفًا أولاً.';return}const b=$('srPublish');b.disabled=true;b.textContent='جاري الرفع…';try{await upload(f,video?'reel':'story',$('srCaption').value.trim());$('srMsg').textContent='تم النشر ✓';if(video)loadReels();else loadStories()}catch(e){$('srMsg').textContent='تعذر النشر: '+e.message}finally{b.disabled=false;b.textContent=video?'نشر الريلز':'نشر القصة'}}}
 async function loadStories(){const row=$('storyRow');if(!row)return;const add='<button id="addStoryBtn" class="story-card add-story" type="button"><div class="story-avatar plus">+</div><b>إنشاء قصة</b></button>';const r=await sb().from('posts').select('id,author_id,media_url,created_at,body').eq('visibility','story').gt('created_at',new Date(Date.now()-86400000).toISOString()).order('created_at',{ascending:false}).limit(30);const items=r.data||[];const ids=[...new Set(items.map(x=>x.author_id).filter(Boolean))];const p=ids.length?await sb().from('profiles').select('id,display_name,avatar_url').in('id',ids):{data:[]};const pm=new Map((p.data||[]).map(x=>[x.id,x]));row.innerHTML=add+items.map(x=>{const a=pm.get(x.author_id)||{},img=a.avatar_url||x.media_url;return `<button class="story-card" data-story-id="${x.id}"><div class="story-avatar">${img?`<img src="${esc(img)}">`:'م'}</div><b>${esc(a.display_name||'مستخدم')}</b></button>`}).join('');$('addStoryBtn').onclick=()=>create('story');row.querySelectorAll('[data-story-id]').forEach(b=>b.onclick=()=>viewStory(b.dataset.storyId))}
 async function viewStory(id){const r=await sb().from('posts').select('id,author_id,media_url,body,created_at').eq('id',id).maybeSingle();if(!r.data)return;const p=await sb().from('profiles').select('display_name').eq('id',r.data.author_id).maybeSingle();const u=r.data.media_url||'';const isv=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u);modal('قصة '+esc(p.data?.display_name||'مستخدم'),`<div class="story-view">${isv?`<video controls autoplay playsinline src="${esc(u)}"></video>`:`<img src="${esc(u)}">`}<p>${esc(r.data.body||'')}</p></div>`)}
 async function loadReels(){const r=await sb().from('posts').select('id,author_id,media_url,body,created_at').eq('visibility','reel').order('created_at',{ascending:false}).limit(30);const items=r.data||[];const ids=[...new Set(items.map(x=>x.author_id).filter(Boolean))];const p=ids.length?await sb().from('profiles').select('id,display_name').in('id',ids):{data:[]};const pm=new Map((p.data||[]).map(x=>[x.id,x]));modal('🎬 الريلز',`<div class="reels-list">${items.length?items.map(x=>`<article class="reel-item"><video controls playsinline preload="metadata" src="${esc(x.media_url)}"></video><div class="reel-caption"><b>${esc(pm.get(x.author_id)?.display_name||'مستخدم')}</b><div>${esc(x.body||'')}</div></div></article>`).join(''):'<div class="empty">لا توجد ريلز بعد. كن أول من ينشر 🎬</div>'}</div>`) }
 function boot(){loadStories();$('addStoryBtn').onclick=()=>create('story');$('allStoriesBtn').onclick=async()=>{await loadStories();const r=document.querySelectorAll('#storyRow [data-story-id]');if(r.length)r[0].click();else create('story')};$('reelsBtn').onclick=()=>loadReels();$('videoBtn')?.addEventListener('click',()=>$('imageInput')?.click())}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,500));else setTimeout(boot,500);window.MadaStoriesReels={loadStories,loadReels,create};
})();
</script><script src="mada-feature-controls.js?v=20260902-5"></script><script src="story-duration-fix.js?v=20260902-2"></script><script src="profile-share-friends-fix.js?v=20260902-1"></script><script src="profile-entry-fix.js?v=20260902-1"></script><script src="pull-to-refresh.js?v=20260902-2"></script><script src="profile-facebook-ui.js?v=20260902-1"></script>
</body></html>
