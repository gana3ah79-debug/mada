<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Mada — مدى</title><link rel="stylesheet" href="styles.css?v=20260901-29"><link rel="stylesheet" href="mada-design-system.css?v=20260902-1"><link rel="stylesheet" href="mada-modern-ui.css?v=20260904-1"><link rel="stylesheet" href="social-upgrades.css?v=20260902-1"><link rel="stylesheet" href="reactions.css?v=20260901-2"><link rel="stylesheet" href="auth-fix.css?v=20260901-5"><link rel="stylesheet" href="mada-feature-controls.css?v=20260902-5"><link rel="stylesheet" href="profile-fix.css?v=20260902-2"></head>
<body>
<section id="auth" class="auth-screen"><div class="auth-card"><button class="auth-sheet-close" type="button" aria-label="إغلاق">×</button><div class="mada-logo large"><span class="logo-mark">M</span><div>MADA</div><small>مدى</small></div><p>تواصل .. شارك .. اكتشف</p><input id="nameInput" type="text" placeholder="الاسم الكامل (اختياري)" autocomplete="name"><input id="emailInput" type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" autocomplete="username"><input id="passwordInput" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn" class="primary wide" type="button">تسجيل الدخول</button><button id="signupBtn" class="auth-secondary wide" type="button">إنشاء حساب جديد</button><button id="forgotBtn" class="link-btn" type="button">نسيت كلمة السر؟</button><div id="authMsg" class="muted"></div></div></section>
<main id="app" hidden>
<header class="topbar"><button id="menuBtn" class="icon-btn" type="button" aria-label="القائمة"><span class="mada-icon">☰</span></button><div class="mada-wordmark">MADA</div><div class="top-actions"><button id="searchBtn" class="icon-btn" type="button" aria-label="البحث"><span class="mada-icon">⌕</span></button><button id="msgBtn" class="icon-btn" type="button" aria-label="الرسائل"><span class="mada-icon">💬</span></button><button id="themeBtn" class="legacy-control" type="button" aria-label="الوضع الليلي"><span class="mada-icon">🌙</span></button><button id="notifyBtn" class="legacy-control" type="button" aria-label="الإشعارات"><span class="mada-icon">🔔</span></button><button id="premiumBtn" class="legacy-control" type="button" aria-label="Premium"><span class="mada-icon">💎</span></button></div></header>
<section class="page-wrap"><div class="stories card"><div class="stories-title"><b>القصص</b><div class="story-tools"><button id="allStoriesBtn" type="button">عرض الكل</button><button id="reelsBtn" type="button"><span class="mada-icon">🎬</span> الريلز</button></div></div><div id="storyRow" class="story-row"><button id="addStoryBtn" class="story-card add-story" type="button"><div class="story-avatar plus">+</div><b>إنشاء قصة</b></button></div></div>
<div class="card composer"><div class="composer-row"><button id="profileNav" class="avatar big-avatar" type="button">م</button><button id="createNav" class="think-input" type="button">بم تفكر؟</button></div><div class="composer-actions reference-actions"><button id="photoBtn" type="button"><span class="mada-icon">🖼️</span> صورة</button><button id="videoBtn" type="button"><span class="mada-icon">🎥</span> فيديو</button><button type="button"><span class="mada-icon">📍</span> موقع</button><button type="button"><span class="mada-icon">🙂</span> شعور</button></div><textarea id="postInput" placeholder="اكتب منشورك..." rows="3"></textarea><input id="imageInput" type="file" accept="image/*,video/*" hidden><div class="composer-actions publish-row"><button id="postBtn" class="primary" type="button">نشر</button></div></div>
<div class="card quick-grid"><button id="friendsNav" type="button"><span class="mada-icon">👥</span>الأصدقاء</button><button id="msgBtn2" type="button"><span class="mada-icon">💬</span>الرسائل</button><button id="notifyNav" type="button"><span class="mada-icon">🔔</span>الإشعارات</button><button id="premiumBannerBtn" type="button"><span class="mada-icon">💎</span>Premium</button></div>
<div id="premiumBanner" class="card premium-banner"><div><b>Mada Premium 💎</b><span>مزايا إضافية وتجربة أفضل</span></div><button id="premiumBannerAction" class="premium-btn" type="button">اشترك الآن</button></div><section id="feed" class="feed"><div class="card empty">جاري تحميل المنشورات…</div></section></section>
<nav class="bottom-nav"><button class="active" type="button"><span class="mada-icon">⌂</span><span>الرئيسية</span></button><button id="friendsBottom" type="button"><span class="mada-icon">♙</span><span>الأصدقاء</span></button><button id="createBottom" class="bottom-plus" type="button" aria-label="إنشاء"><span>＋</span></button><button id="notifyBottom" type="button"><span class="mada-icon">◉</span><span>الإشعارات</span></button><button id="menuBottom" type="button"><span class="mada-icon">☷</span><span>القائمة</span></button></nav></main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close" type="button">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260901-26"></script><script src="app.js?v=20260901-24"></script><script src="app-hotfix.js?v=20260901-5"></script><script src="auth-stable.js?v=20260902-4"></script><script src="profile.js?v=20260902-5"></script><script src="social.js?v=20260901-5"></script><script src="payment-ui.js?v=20260901-3"></script><script src="admin-inline.js?v=20260901-2"></script><script src="reactions.js?v=20260902-4"></script><script src="reaction-enhancer.js?v=20260902-1"></script><script src="post-menu.js?v=20260902-3"></script><script src="post-layout-fix.js?v=20260901-2"></script><script src="mada-social-upgrades.js?v=20260902-1"></script><script src="mada-feature-controls.js?v=20260902-5"></script><script src="story-duration-fix.js?v=20260902-2"></script><script src="profile-share-friends-fix.js?v=20260902-1"></script><script src="profile-entry-fix.js?v=20260902-3"></script><script src="pull-to-refresh.js?v=20260902-2"></script><script src="profile-facebook-polish.js?v=20260902-5"></script><script src="mada-backend-sync.js?v=20260902-1"></script><script src="profile-layout-fix.js?v=20260902-2"></script><script src="mada-icons.js?v=20260904-1"></script></body></html>
