<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Mada — مدى</title><link rel="stylesheet" href="styles.css?v=20260901-25"></head>
<body>
<section id="auth" class="auth-screen"><div class="auth-card"><div class="mada-logo large"><span class="logo-mark">M</span><div>MADA</div><small>مدى</small></div><p>تواصل .. شارك .. اكتشف</p><input id="nameInput" type="text" placeholder="الاسم الكامل (للحساب الجديد)" autocomplete="name"><input id="emailInput" type="email" placeholder="البريد الإلكتروني أو رقم الهاتف" autocomplete="email"><input id="passwordInput" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn" class="primary wide" type="button">تسجيل الدخول</button><button id="adminLoginBtn" class="admin-action" type="button">⚙️ دخول الإدارة</button><button class="link-btn" type="button">نسيت كلمة المرور؟</button><div id="authMsg" class="muted"></div></div></section>
<main id="app" hidden>
<header class="topbar"><button id="menuBtn" class="icon-btn" type="button">☰</button><div class="mada-wordmark">MADA</div><div class="top-actions"><button id="searchBtn" class="icon-btn" type="button">⌕</button><button id="msgBtn" class="icon-btn" type="button">💬</button><button id="themeBtn" class="legacy-control" type="button">🌙</button><button id="notifyBtn" class="legacy-control" type="button">🔔</button><button id="premiumBtn" class="legacy-control" type="button">💎</button></div></header>
<section class="page-wrap">
<div class="stories card"><div class="stories-title"><b>القصص</b><span>عرض الكل</span></div><div class="story-row"><button class="story-card add-story"><div class="story-avatar plus">+</div><b>إنشاء قصة</b></button><button class="story-card"><div class="story-avatar gradient-a">أ</div><b>أحمد</b></button><button class="story-card"><div class="story-avatar gradient-b">س</div><b>سارة</b></button><button class="story-card"><div class="story-avatar gradient-c">م</div><b>محمد</b></button><button class="story-card"><div class="story-avatar gradient-d">م</div><b>مريم</b></button></div></div>
<div class="card composer"><div class="composer-row"><button id="profileNav" class="avatar big-avatar" type="button">م</button><button id="createNav" class="think-input" type="button">بم تفكر؟</button></div><div class="composer-actions reference-actions"><button id="photoBtn" type="button">🖼️ صورة</button><button type="button">🎥 فيديو</button><button type="button">📍 موقع</button><button type="button">🙂 شعور</button></div><textarea id="postInput" placeholder="اكتب منشورك..." rows="3"></textarea><input id="imageInput" type="file" accept="image/*" hidden><div class="composer-actions publish-row"><button id="postBtn" class="primary" type="button">نشر</button></div></div>
<div class="card quick-grid"><button id="friendsNav" type="button"><span>👥</span>الأصدقاء</button><button id="msgBtn2" type="button"><span>💬</span>الرسائل</button><button id="notifyNav" type="button"><span>🔔</span>الإشعارات</button><button id="premiumBannerBtn" type="button"><span>💎</span>Premium</button></div>
<div id="premiumBanner" class="card premium-banner"><div><b>Mada Premium 💎</b><span>مزايا إضافية وتجربة أفضل</span></div><button id="premiumBannerAction" class="premium-btn" type="button">اشترك الآن</button></div>
<section id="feed" class="feed"><div class="card empty">جاري تحميل المنشورات…</div></section>
</section>
<nav class="bottom-nav"><button class="active" type="button">🏠<span>الرئيسية</span></button><button id="friendsBottom" type="button">👥<span>الأصدقاء</span></button><button id="createBottom" class="bottom-plus" type="button">＋</button><button id="notifyBottom" type="button">🔔<span>الإشعارات</span></button><button id="menuBottom" type="button">☰<span>القائمة</span></button></nav>
</main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close" type="button">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260901-25"></script><script src="app.js?v=20260901-24"></script><script src="app-hotfix.js?v=20260901-2"></script><script src="profile.js?v=20260901-6"></script><script src="social.js?v=20260901-5"></script><script src="admin-inline.js?v=20260901-2"></script>
</body></html>
