<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1877f2"><title>استعادة كلمة المرور - Mada</title><link rel="stylesheet" href="auth-modern.css?v=20260904-01"><style>body{margin:0;background:#f0f4f9}.reset-wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.reset-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 18px 45px rgba(0,0,0,.1);text-align:center}.reset-card h1{margin:0 0 8px}.reset-card p{color:#667085;font-size:13px}.reset-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e1e6ef;border-radius:13px;margin:7px 0;outline:0}.reset-card button{width:100%;border:0;border-radius:13px;padding:13px;background:#1877f2;color:#fff;font-weight:800;margin-top:8px}.reset-card .back{background:#eef1f5;color:#344054}.msg{min-height:22px;margin-top:12px;font-size:13px}</style></head><body><main class="reset-wrap"><section class="reset-card"><div style="font-size:40px">🔐</div><h1>استعادة كلمة المرور</h1><p>اكتب كلمة المرور الجديدة لحسابك في Mada.</p><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="كلمة المرور الجديدة"><input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="تأكيد كلمة المرور"><button id="save">حفظ كلمة المرور</button><button class="back" id="back">العودة لتسجيل الدخول</button><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260904-01"></script><script>(function(){const sb=window.supabase.createClient(window.MADA_SUPABASE_URL,window.MADA_SUPABASE_KEY),$=id=>document.getElementById(id),msg=(t,e)=>{$('msg').textContent=t;$('msg').style.color=e?'#dc2626':'#087443'};sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')msg('اكتب كلمة المرور الجديدة ثم اضغط حفظ.',false)});$('save').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(p.length<6)return msg('كلمة المرور يجب أن تكون 6 أحرف على الأقل.',true);if(p!==c)return msg('كلمتا المرور غير متطابقتين.',true);$('save').disabled=true;$('save').textContent='جارٍ الحفظ…';try{const{error}=await sb.auth.updateUser({password:p});if(error)throw error;msg('تم تغيير كلمة المرور بنجاح ✓',false);setTimeout(()=>location.href='index.html',900)}catch(e){msg('تعذر تغيير كلمة المرور: '+(e.message||'حاول مرة أخرى'),true)}finally{$('save').disabled=false;$('save').textContent='حفظ كلمة المرور'}};$('back').onclick=()=>location.href='index.html'})();</script></body></html>
